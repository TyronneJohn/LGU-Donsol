<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/donsol-seal.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>LGU Donsol Staff Portal</title>
    <!-- Applies a saved dark-mode choice before first paint (no light
         flash). Key must match THEME_STORAGE_KEY in ThemeContext.jsx. -->
    <script>
      try {
        if (localStorage.getItem('lgu-donsol:theme') === 'dark') document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
